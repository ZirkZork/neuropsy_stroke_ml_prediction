cfg_tag: test_settings
rng_seed: 0
lesionmap_processing:
  lesion_overlap_theshold: 0.05
  mask_overlap_cutoff: 0.1
  slice_offset: -2
  slice_spacing: 5
  do_volume_control: true
retraining:
  retrain_alpha_cutoffs:
  - 0.9
  - 0.8
  - 0.7
  - 0.6
  - 0.5
  - 0.4
  - 0.3
  - 0.2
  - 0.1
  retrain_mask_overlap_cutoff: 0
training_parameters:
  n_cv_folds: 4
  n_cv_split_repetitions: 25
  n_permutations: 10000
variable_selection:
  filter_variables: 
  - time_post_stroke<=90
  - handedness_label=="r"
  - stroke_type!="haemorrhagic"
  prediction_target: 'hand_imi_label'
  sample_id: 'sub_id'
variables:
- name: sub_id
  type: label
- name: hand_imi_score
  type: int
- formular: hand_imi_score:0to17->deficit;18to20->no_deficit
  name: hand_imi_label
  options:
  - deficit
  - no_deficit
  type: cat
- name: handedness_lq
  type: int
- formular: handedness_lq:-100to-28->l;48to100->r;-27to47->a
  name: handedness_label
  options:
  - l
  - r
  - a
  type: cat
- name: date_of_birth
  type: date
- formular: test_date-date_of_birth
  name: age
  type: int
  unit: year
- name: stroke_type
  options:
  - ischemic
  - haemorrhagic
  type: cat
- name: stroke_date
  type: date
- name: test_date
  type: date
- formular: test_date-stroke_date
  name: time_post_stroke
  type: int
  unit: day
